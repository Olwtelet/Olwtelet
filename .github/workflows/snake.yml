name: Generate contribution snake

# The contribution graph changes at most once a day, so this runs on a daily
# schedule instead of on every push — fewer runs means fewer chances to hit a
# transient "fetch failed" from GitHub's contribution API.
on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # lets you trigger it manually from the Actions tab

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Platane/snk fetches the contribution calendar over the network, which
      # occasionally fails with a bare "fetch failed". One retry absorbs that
      # without turning a transient blip into a failed run.
      - name: Generate github-contribution-grid-snake.svg
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Retry generation
        if: steps.snake.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg

      # publishes dist/ to the "output" branch — the README points to
      # https://raw.githubusercontent.com/<you>/<you>/output/github-contribution-grid-snake.svg
      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
