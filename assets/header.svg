<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Broadcast control room: SMPTE color bars, a terminal boot sequence identifying Isaac Rodrigues Barros — computer science student working on AI, automation and full-stack web from Brasília, Brazil — VU meters, and a red ON AIR light. Station ID: OLWTELET.">
  <!--
    OLWTELET control-room header
    One-shot boot sequence (clip-path wipes, ~4s), then steady state:
    ON AIR blink · REC pulse · VU levels · scrolling waveform · cursor.
    SMIL only — no JS, no external fonts. Palette: SMPTE 75% on #050505.
  -->

  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000"/>
    </pattern>
    <clipPath id="l1"><rect x="30" y="128" width="0" height="20"><animate attributeName="width" from="0" to="520" begin="0.3s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="30" y="150" width="0" height="20"><animate attributeName="width" from="0" to="520" begin="1.0s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="30" y="172" width="0" height="20"><animate attributeName="width" from="0" to="520" begin="1.9s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="30" y="194" width="0" height="20"><animate attributeName="width" from="0" to="520" begin="2.7s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="30" y="216" width="0" height="20"><animate attributeName="width" from="0" to="520" begin="3.3s" dur="0.5s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="400" fill="#050505"/>

  <!-- top technical strip -->
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="11" fill="#5a5a5a" letter-spacing="2">
    <text x="16" y="17">OLW-TV · CONTROL ROOM</text>
    <text x="1184" y="17" text-anchor="end">LIVE FEED · 59.94 Hz</text>
  </g>

  <!-- SMPTE 75% bars -->
  <g>
    <rect x="0.00"    y="26" width="171.43" height="62" fill="#C0C0C0"/>
    <rect x="171.43"  y="26" width="171.43" height="62" fill="#C0C000"/>
    <rect x="342.86"  y="26" width="171.43" height="62" fill="#00C0C0"/>
    <rect x="514.29"  y="26" width="171.43" height="62" fill="#00C000"/>
    <rect x="685.71"  y="26" width="171.43" height="62" fill="#C000C0"/>
    <rect x="857.14"  y="26" width="171.43" height="62" fill="#C00000"/>
    <rect x="1028.57" y="26" width="171.43" height="62" fill="#0000C0"/>
  </g>
  <!-- reverse mini-strip -->
  <g>
    <rect x="0.00"    y="88" width="171.43" height="12" fill="#0000C0"/>
    <rect x="171.43"  y="88" width="171.43" height="12" fill="#0A0A0A"/>
    <rect x="342.86"  y="88" width="171.43" height="12" fill="#C000C0"/>
    <rect x="514.29"  y="88" width="171.43" height="12" fill="#0A0A0A"/>
    <rect x="685.71"  y="88" width="171.43" height="12" fill="#00C0C0"/>
    <rect x="857.14"  y="88" width="171.43" height="12" fill="#0A0A0A"/>
    <rect x="1028.57" y="88" width="171.43" height="12" fill="#C0C0C0"/>
  </g>
  <rect x="0" y="26" width="1200" height="74" fill="url(#scan)" opacity="0.12"/>

  <!-- ══ console: terminal panel (left) ══ -->
  <rect x="16" y="116" width="764" height="130" fill="#070707" stroke="#1e1e1e" stroke-width="1.5"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15">
    <g clip-path="url(#l1)"><text x="36" y="143"><tspan fill="#00C000">$</tspan><tspan fill="#C0C0C0"> boot olwtelet.sys</tspan></text></g>
    <g clip-path="url(#l2)"><text x="36" y="165"><tspan fill="#00C000">[ OK ]</tspan><tspan fill="#909090"> identity: isaac rodrigues barros — cs student</tspan></text></g>
    <g clip-path="url(#l3)"><text x="36" y="187"><tspan fill="#00C000">[ OK ]</tspan><tspan fill="#909090"> modules: ai · automation · full-stack web</tspan></text></g>
    <g clip-path="url(#l4)"><text x="36" y="209"><tspan fill="#00C000">[ OK ]</tspan><tspan fill="#909090"> uplink: brasília, br</tspan></text></g>
    <g clip-path="url(#l5)"><text x="36" y="231"><tspan fill="#00C000">$</tspan><tspan fill="#C0C0C0"> signal --transmit</tspan></text></g>
    <!-- block cursor, appears after boot -->
    <rect x="216" y="219" width="9" height="15" fill="#C0C0C0" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" begin="4.0s" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ console: monitor panel (right) ══ -->
  <rect x="796" y="116" width="388" height="130" fill="#070707" stroke="#1e1e1e" stroke-width="1.5"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">
    <text x="816" y="140" font-size="11" letter-spacing="2" fill="#5a5a5a">CH 001 · MONITOR</text>
    <!-- REC -->
    <circle cx="1130" cy="136" r="5" fill="#C00000">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1144" y="140" font-size="11" letter-spacing="2" fill="#909090">REC</text>

    <!-- VU meters -->
    <text x="816" y="166" font-size="10" fill="#666666">VU·L</text>
    <rect x="856" y="157" width="250" height="9" fill="#101010" stroke="#222222" stroke-width="1"/>
    <rect x="856" y="157" width="160" height="9" fill="#00C000">
      <animate attributeName="width" values="150;205;120;230;165;150" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="1106" y="157" width="18" height="9" fill="#C00000" opacity="0.55"/>

    <text x="816" y="186" font-size="10" fill="#666666">VU·R</text>
    <rect x="856" y="177" width="250" height="9" fill="#101010" stroke="#222222" stroke-width="1"/>
    <rect x="856" y="177" width="140" height="9" fill="#00C000">
      <animate attributeName="width" values="170;115;220;140;195;170" dur="3.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="1106" y="177" width="18" height="9" fill="#C00000" opacity="0.55"/>

    <!-- ON AIR -->
    <rect x="816" y="200" width="150" height="34" rx="3" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <circle cx="838" cy="217" r="6" fill="#C00000">
      <animate attributeName="opacity" values="1;1;0.25;1" keyTimes="0;0.55;0.75;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="856" y="222" font-size="15" letter-spacing="4" fill="#C0C0C0">ON AIR</text>
    <text x="984" y="222" font-size="11" letter-spacing="1" fill="#444444">SRC: GITHUB</text>
  </g>

  <!-- ══ station identification ══ -->
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">
    <text x="20" y="308" font-size="42" font-weight="bold" letter-spacing="8" fill="#C0C0C0">OLWTELET</text>
    <text x="22" y="330" font-size="12" letter-spacing="2" fill="#666666">ISAAC RODRIGUES BARROS · SOFTWARE IN TRANSMISSION</text>
    <text x="1184" y="308" text-anchor="end" font-size="12" letter-spacing="3" fill="#444444">88.1 MHz · CARRIER LOCKED</text>
  </g>

  <!-- ══ signal waveform ══ -->
  <line x1="0" y1="366" x2="1200" y2="366" stroke="#1a1a1a" stroke-width="1"/>
  <g>
    <path d="M -240 366 Q -210 340 -180 366 T -120 366 T -60 366 T 0 366 T 60 366 T 120 366 T 180 366 T 240 366 T 300 366 T 360 366 T 420 366 T 480 366 T 540 366 T 600 366 T 660 366 T 720 366 T 780 366 T 840 366 T 900 366 T 960 366 T 1020 366 T 1080 366 T 1140 366 T 1200 366 T 1260 366 T 1320 366 T 1380 366 T 1440 366" fill="none" stroke="#00C0C0" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M -240 366 Q -210 348 -180 366 T -120 366 T -60 366 T 0 366 T 60 366 T 120 366 T 180 366 T 240 366 T 300 366 T 360 366 T 420 366 T 480 366 T 540 366 T 600 366 T 660 366 T 720 366 T 780 366 T 840 366 T 900 366 T 960 366 T 1020 366 T 1080 366 T 1140 366 T 1200 366 T 1260 366 T 1320 366 T 1380 366 T 1440 366" fill="none" stroke="#C0C000" stroke-width="1.5" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" from="-60 0" to="-180 0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- graticule -->
  <g stroke="#3a3a3a" stroke-width="1.5">
    <line x1="100"  y1="388" x2="100"  y2="396"/>
    <line x1="300"  y1="384" x2="300"  y2="396"/>
    <line x1="500"  y1="388" x2="500"  y2="396"/>
    <line x1="700"  y1="384" x2="700"  y2="396"/>
    <line x1="900"  y1="388" x2="900"  y2="396"/>
    <line x1="1100" y1="384" x2="1100" y2="396"/>
  </g>

  <!-- keyline frame -->
  <rect x="0" y="0" width="1200" height="400" fill="none" stroke="#000000" stroke-width="6"/>
</svg>
